name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # P2B: fails on physical-direction styles (ml-, pr-, left-, text-right, border-l, …) and on
      # directional icons with no RTL mirror. Both are invisible in English and break Arabic.
      - name: RTL gate (logical properties + icon mirroring)
        run: pnpm lint:rtl

      - name: i18n source gate
        run: pnpm lint:i18n

      - name: i18n catalog structure and ICU parity
        run: pnpm i18n:missing

      - name: i18n unused-key gate
        run: pnpm i18n:unused

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm vitest run tests/unit/actions tests/unit/components tests/unit/db tests/unit/lib tests/unit/pages tests/unit/security tests/unit/sanity.test.ts

      # P6A: adversarial prompt-injection corpus (ar/en + dialects) and the
      # bilingual evaluation set, graded against the real tool-authorization
      # oracle. Required job: asserts no injection can reach an unauthorized tool
      # and every eval rubric is consistent with the product's auth model.
      # Deterministic, no model or database — runs with the other unit tests.
      - name: AI adversarial & evaluation suites (P6A)
        run: pnpm test:ai-adversarial

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase test env
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase-env
          set -a
          source /tmp/supabase-env
          set +a

          : "${API_URL:?supabase status did not provide API_URL}"
          : "${ANON_KEY:?supabase status did not provide ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not provide SERVICE_ROLE_KEY}"

          {
            echo "LOCAL_SUPABASE_URL=$API_URL"
            echo "LOCAL_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

      - name: Build (smoke)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
