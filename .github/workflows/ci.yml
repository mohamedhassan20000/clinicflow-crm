name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # P2B: fails on physical-direction styles (ml-, pr-, left-, text-right, border-l, …) and on
      # directional icons with no RTL mirror. Both are invisible in English and break Arabic.
      - name: RTL gate (logical properties + icon mirroring)
        run: pnpm lint:rtl

      - name: i18n source gate
        run: pnpm lint:i18n

      - name: i18n catalog structure and ICU parity
        run: pnpm i18n:missing

      - name: i18n unused-key gate
        run: pnpm i18n:unused

      - name: WhatsApp worker install
        run: pnpm whatsapp:worker:install

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm vitest run tests/unit/actions tests/unit/components tests/unit/db tests/unit/lib tests/unit/pages tests/unit/security tests/unit/sanity.test.ts

      # P6A: adversarial prompt-injection corpus (ar/en + dialects) and the
      # bilingual evaluation set, graded against the real tool-authorization
      # oracle. Required job: asserts no injection can reach an unauthorized tool
      # and every eval rubric is consistent with the product's auth model.
      # Deterministic, no model or database — runs with the other unit tests.
      - name: AI adversarial & evaluation suites (P6A)
        run: pnpm test:ai-adversarial

      # Scored Staff Assistant eval gate. Twelve dimensions of answer /
      # tool-selection quality — tool, action and resource selection, forbidden-
      # capability containment, hallucinated capability, unnecessary refusal and
      # escalation, multi-step completion, clinical/privacy policy adherence, and
      # role-specific authorization — scored against a committed baseline in
      # docs/reviews/artifacts/staff-eval-baseline.json and failed on regression.
      #
      # Required because it is deterministic: every number comes from the real
      # registries, router, task policies and system prompt, with no model, no
      # network and no database. The live-graded half of the same scorer is
      # opt-in and stays out of CI by design — a required job that needs model
      # credentials and spend is a job that gets disabled.
      - name: Scored staff eval gate
        run: pnpm test:ai-staff-gate

      # P7E: the pairing worker is a separate deployable with its own dependency
      # tree, so it is installed and checked on its own. Its suite covers the
      # start path — a caller answered before the socket is up, one socket per
      # clinic, and failures on the asynchronous half — which nothing in the
      # application's own tests can reach.
      - name: WhatsApp worker typecheck
        run: pnpm whatsapp:worker:typecheck

      - name: WhatsApp worker tests
        run: pnpm whatsapp:worker:test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase test env
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase-env
          set -a
          source /tmp/supabase-env
          set +a

          : "${API_URL:?supabase status did not provide API_URL}"
          : "${ANON_KEY:?supabase status did not provide ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not provide SERVICE_ROLE_KEY}"

          {
            echo "LOCAL_SUPABASE_URL=$API_URL"
            echo "LOCAL_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

      - name: Build (smoke)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
